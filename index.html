<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- JS kapalıysa (nadiren) doğrudan asistan.html'e düş — onboarding
       ekranını atlamak, hiç açılmamaktan iyidir. JS açıksa aşağıdaki script
       daha önce onboarding'i tamamlamış mı diye bakıp doğru yere yönlendirir. -->
  <noscript><meta http-equiv="refresh" content="0; url=asistan.html"></noscript>
  <link rel="manifest" href="manifest.json">
  <title>ONE Global</title>
</head>
<body style="background:#07111F">
  <script>
    // hosgeldin.html artık hem ilk kayıt akışını hem de her açılıştaki
    // kısa marka ekranını (splash) kendisi yönetiyor (bkz. o dosyadaki
    // "returning-user" mantığı) — bu yüzden buradan her zaman oraya
    // yönlendiriyoruz, onboarding durumuna bakmamıza gerek kalmadı.
    try {
      window.location.replace('hosgeldin.html');
    } catch (e) {
      window.location.replace('asistan.html');
    }
  </script>
</body>
</html>
