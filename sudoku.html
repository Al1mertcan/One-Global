<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="native.js"></script>
  <script src="profile.js"></script>
  <title>Hemcan — Günlük sudoku</title>

  <!-- Tailwind CSS (pinned — matches the renderer/screenshot surfaces) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(7 17 31 / <alpha-value>)',
          foreground: 'rgb(239 247 255 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(57 215 255 / <alpha-value>)', foreground: 'rgb(3 18 28 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(22 42 70 / <alpha-value>)', foreground: 'rgb(225 238 255 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(167 139 250 / <alpha-value>)', foreground: 'rgb(19 13 40 / <alpha-value>)' },
          muted: { DEFAULT: 'rgb(16 33 58 / <alpha-value>)', foreground: 'rgb(168 188 211 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(12 27 48 / <alpha-value>)', foreground: 'rgb(239 247 255 / <alpha-value>)' },
          border: 'rgb(40 65 95 / <alpha-value>)',
          input: 'rgb(16 37 64 / <alpha-value>)',
          destructive: { DEFAULT: 'rgb(255 101 122 / <alpha-value>)', foreground: 'rgb(38 4 10 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(61 219 165 / <alpha-value>)', foreground: 'rgb(3 27 20 / <alpha-value>)' },
          chart1: 'rgb(57 215 255 / <alpha-value>)',
          chart2: 'rgb(167 139 250 / <alpha-value>)',
          chart3: 'rgb(61 219 165 / <alpha-value>)',
          chart4: 'rgb(112 167 255 / <alpha-value>)',
          chart5: 'rgb(242 182 109 / <alpha-value>)',
          ring: 'rgb(57 215 255 / <alpha-value>)',
        },
        fontFamily: {
          heading: ['var(--font-heading, Inter)', 'system-ui'],
          body: ['var(--font-body, Inter)', 'system-ui'],
        },
        borderRadius: { DEFAULT: 'var(--radius, 12px)', theme: 'var(--radius, 12px)' },
      }}
    };
</script>

  <!-- Iconify Web Component -->
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@100;200;300;400;500;600;700;800;900&family=Manrope:wght@100;200;300;400;500;600;700;800;900&display=swap">

  <!-- Design Tokens + Custom Classes -->
  <style>
  :root {
    --color-background: #07111F;
    --color-foreground: #EFF7FF;
    --color-primary: #39D7FF;
    --color-primary-foreground: #03121C;
    --color-secondary: #162A46;
    --color-secondary-foreground: #E1EEFF;
    --color-accent: #A78BFA;
    --color-accent-foreground: #130D28;
    --color-muted: #10213A;
    --color-muted-foreground: #A8BCD3;
    --color-card: #0C1B30;
    --color-card-foreground: #EFF7FF;
    --color-border: #28415F;
    --color-input: #102540;
    --color-destructive: #FF657A;
    --color-destructive-foreground: #26040A;
    --color-success: #3DDBA5;
    --color-success-foreground: #031B14;
    --color-chart1: #39D7FF;
    --color-chart2: #A78BFA;
    --color-chart3: #3DDBA5;
    --color-chart4: #70A7FF;
    --color-chart5: #F2B66D;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --radius: 16px;
  }

  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0;
  }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111F">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hemcan">
</head>
<body class="bg-background text-foreground m-0 p-0">
  <div class="min-h-screen w-full bg-background text-foreground font-body relative overflow-hidden pb-24">
    <div class="pointer-events-none absolute -top-28 -right-24 h-72 w-72 rounded-full bg-primary/10 blur-3xl"></div>
    <div class="pointer-events-none absolute top-[430px] -left-32 h-72 w-72 rounded-full bg-accent/10 blur-3xl"></div>

    <header class="relative px-5 pt-12">
      <div class="flex items-center justify-between">
        <a href="mola.html" data-i18n-aria="wbBack" aria-label="Geri" class="flex h-11 w-11 items-center justify-center rounded-theme border border-border bg-card/80 text-foreground shadow-lg backdrop-blur-xl">
          <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
        </a>
        <span class="text-xs font-semibold uppercase tracking-[0.15em] text-muted-foreground" data-i18n="sdHeader">Günlük sudoku</span>
        <select id="lang-select" aria-label="Dili değiştir / Change language" class="h-11 max-w-[92px] rounded-theme border border-border bg-card px-2 text-xs font-bold text-card-foreground"></select>
      </div>
    </header>

    <main class="relative px-5 pt-6">
      <section id="sd-home">
        <div class="rounded-[24px] border border-primary/25 bg-card p-4">
          <h1 class="font-heading text-base font-semibold" data-i18n="sdHeader">Günlük sudoku</h1>
          <p id="sd-date" class="mt-1 text-[11px] font-semibold text-primary"></p>
          <p class="mt-2 text-[11px] leading-5 text-muted-foreground" data-i18n="sdIntro">Her gün herkes aynı bulmacayı çözer.</p>
          <p class="mt-1 text-[11px] leading-5 text-muted-foreground" data-i18n="dlOneTry">Her gün her oyun için tek hakkın var.</p>
        </div>
        <ul id="sd-cards" class="mt-4 grid gap-3"></ul>
        <section class="mt-5">
          <h2 class="text-xs font-semibold uppercase tracking-[0.12em] text-muted-foreground" data-i18n="dlPast">Önceki günler</h2>
          <ul id="sd-past" class="mt-2 grid gap-2"></ul>
        </section>
        <p class="mt-4 text-[11px] leading-5 text-muted-foreground" data-i18n="dlPrivacy">Sıralamada isim görünmez.</p>
      </section>

      <section id="sd-connect" class="hidden rounded-[24px] border border-border bg-card p-4 text-center">
        <p id="sd-connect-msg" class="text-sm font-semibold" data-i18n="dlConnecting" role="status">Bağlanıyor…</p>
        <div id="sd-connect-btns" class="mt-3 hidden grid-cols-2 gap-2">
          <button id="sd-retry" type="button" class="h-11 rounded-theme bg-primary text-xs font-bold text-primary-foreground" data-i18n="dlRetry">Tekrar dene</button>
          <button id="sd-unranked" type="button" class="h-11 rounded-theme border border-border bg-input text-xs font-bold text-card-foreground" data-i18n="dlPlayUnranked">Sıralamasız oyna</button>
        </div>
        <button id="sd-connect-back" type="button" class="mt-3 h-10 w-full rounded-theme border border-border bg-input text-xs font-bold text-card-foreground" data-i18n="dlMenu">Menü</button>
      </section>

      <section id="sd-play" class="hidden">
        <div class="flex items-center justify-between gap-2">
          <button id="sd-menu" type="button" class="h-10 rounded-theme border border-border bg-card px-3 text-xs font-bold text-card-foreground" data-i18n="dlMenu">Menü</button>
          <p id="sd-level" class="text-xs font-bold uppercase tracking-[0.12em] text-primary"></p>
          <p id="sd-clock" class="min-w-[64px] text-right font-heading text-xl font-bold tabular-nums" role="timer" aria-live="off">0:00</p>
        </div>
        <div id="sd-grid" class="mx-auto mt-3 grid w-full max-w-[420px] grid-cols-9 overflow-hidden rounded-xl border-2 border-foreground/70 bg-card" role="grid"></div>
        <p id="sd-msg" class="mx-auto mt-2 min-h-[1.25rem] max-w-[420px] text-center text-xs font-semibold text-destructive" role="status"></p>
        <div class="mx-auto mt-1 grid max-w-[420px] grid-cols-3 gap-2">
          <button id="sd-undo" type="button" class="h-11 rounded-theme border border-border bg-card text-xs font-bold text-card-foreground" data-i18n="sdUndo">Geri al</button>
          <button id="sd-erase" type="button" class="h-11 rounded-theme border border-border bg-card text-xs font-bold text-card-foreground" data-i18n="sdErase">Sil</button>
          <button id="sd-notes" type="button" aria-pressed="false" class="h-11 rounded-theme border border-border bg-card text-xs font-bold text-card-foreground" data-i18n="sdNotes">Not</button>
        </div>
        <div id="sd-pad" class="mx-auto mt-2 grid max-w-[420px] grid-cols-9 gap-1"></div>
        <p class="mx-auto mt-3 max-w-[420px] text-center text-[11px] leading-5 text-muted-foreground" data-i18n="sdPauseNote">Uygulama arka plandayken süre durur.</p>
      </section>

      <section id="sd-done" class="hidden rounded-[24px] border border-success/30 bg-success/5 p-5 text-center">
        <p class="text-3xl" aria-hidden="true">🎉</p>
        <h2 class="mt-2 font-heading text-xl font-bold" data-i18n="sdSolved">Bitirdin!</h2>
        <p id="sd-done-time" class="mt-1 text-sm font-semibold"></p>
        <p id="sd-done-rank" class="mt-3 text-xs font-semibold leading-5 text-card-foreground"></p>
        <button id="sd-done-menu" type="button" class="mt-4 h-11 w-full rounded-theme bg-primary text-sm font-bold text-primary-foreground" data-i18n="dlMenu">Menü</button>
      </section>

    </main>
  </div>

  <script src="wb-strings.js"></script>
  <script src="i18n.js"></script>
  <script src="wellbeing.js"></script>
  <script src="daily-core.js"></script>
  <script src="daily-net.js"></script>
  <script src="sudoku.js"></script>
</body>
</html>
