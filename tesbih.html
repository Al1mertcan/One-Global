<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="native.js"></script>
  <script src="profile.js"></script>
  <title>Tesbih sayacı — Hemcan</title>

  <!-- Tailwind CSS (pinned — matches the renderer/screenshot surfaces) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          background: 'rgb(7 17 31 / <alpha-value>)',
          foreground: 'rgb(239 247 255 / <alpha-value>)',
          primary: { DEFAULT: 'rgb(57 215 255 / <alpha-value>)', foreground: 'rgb(3 18 28 / <alpha-value>)' },
          secondary: { DEFAULT: 'rgb(22 42 70 / <alpha-value>)', foreground: 'rgb(225 238 255 / <alpha-value>)' },
          accent: { DEFAULT: 'rgb(167 139 250 / <alpha-value>)', foreground: 'rgb(19 13 40 / <alpha-value>)' },
          muted: { DEFAULT: 'rgb(16 33 58 / <alpha-value>)', foreground: 'rgb(168 188 211 / <alpha-value>)' },
          card: { DEFAULT: 'rgb(12 27 48 / <alpha-value>)', foreground: 'rgb(239 247 255 / <alpha-value>)' },
          border: 'rgb(40 65 95 / <alpha-value>)',
          input: 'rgb(16 37 64 / <alpha-value>)',
          destructive: { DEFAULT: 'rgb(255 101 122 / <alpha-value>)', foreground: 'rgb(38 4 10 / <alpha-value>)' },
          success: { DEFAULT: 'rgb(61 219 165 / <alpha-value>)', foreground: 'rgb(3 27 20 / <alpha-value>)' },
          chart1: 'rgb(57 215 255 / <alpha-value>)',
          chart2: 'rgb(167 139 250 / <alpha-value>)',
          chart3: 'rgb(61 219 165 / <alpha-value>)',
          chart4: 'rgb(112 167 255 / <alpha-value>)',
          chart5: 'rgb(242 182 109 / <alpha-value>)',
          ring: 'rgb(57 215 255 / <alpha-value>)',
        },
        fontFamily: {
          heading: ['var(--font-heading, Inter)', 'system-ui'],
          body: ['var(--font-body, Inter)', 'system-ui'],
        },
        borderRadius: { DEFAULT: 'var(--radius, 12px)', theme: 'var(--radius, 12px)' },
      }}
    };
</script>

  <!-- Iconify Web Component -->
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@100;200;300;400;500;600;700;800;900&family=Manrope:wght@100;200;300;400;500;600;700;800;900&display=swap">

  <!-- Design Tokens + Custom Classes -->
  <style>
  :root {
    --color-background: #07111F;
    --color-foreground: #EFF7FF;
    --color-primary: #39D7FF;
    --color-primary-foreground: #03121C;
    --color-secondary: #162A46;
    --color-secondary-foreground: #E1EEFF;
    --color-accent: #A78BFA;
    --color-accent-foreground: #130D28;
    --color-muted: #10213A;
    --color-muted-foreground: #A8BCD3;
    --color-card: #0C1B30;
    --color-card-foreground: #EFF7FF;
    --color-border: #28415F;
    --color-input: #102540;
    --color-destructive: #FF657A;
    --color-destructive-foreground: #26040A;
    --color-success: #3DDBA5;
    --color-success-foreground: #031B14;
    --color-chart1: #39D7FF;
    --color-chart2: #A78BFA;
    --color-chart3: #3DDBA5;
    --color-chart4: #70A7FF;
    --color-chart5: #F2B66D;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --radius: 16px;
  }

  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0;
  }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111F">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hemcan">
</head>
<body class="bg-background text-foreground m-0 p-0">
  <div class="min-h-screen w-full bg-background text-foreground font-body relative overflow-hidden pb-24">
    <div class="pointer-events-none absolute -top-28 -right-24 h-72 w-72 rounded-full bg-primary/10 blur-3xl"></div>
    <div class="pointer-events-none absolute top-[430px] -left-32 h-72 w-72 rounded-full bg-accent/10 blur-3xl"></div>

    <header class="relative px-5 pt-12">
      <div class="flex items-center justify-between">
        <a href="asistan.html" data-i18n-aria="wbBack" aria-label="Geri" class="flex h-11 w-11 items-center justify-center rounded-theme border border-border bg-card/80 text-foreground shadow-lg backdrop-blur-xl">
          <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
        </a>
        <span class="text-xs font-semibold uppercase tracking-[0.15em] text-muted-foreground" data-i18n="tesHeader">Tesbih sayacı</span>
        <select id="lang-select" aria-label="Dili değiştir / Change language" class="h-11 max-w-[92px] rounded-theme border border-border bg-card px-2 text-xs font-bold text-card-foreground"></select>
      </div>
    </header>

    <main class="relative px-5 pt-6">
      <div id="chips" class="-mx-5 flex gap-2 overflow-x-auto px-5 pb-1" role="tablist"></div>

      <section class="mt-4 rounded-[24px] border border-chart2/25 bg-card p-4 text-center">
        <h1 id="dhikr-name" class="font-heading text-lg font-semibold text-chart2"></h1>
        <p id="dhikr-ar" dir="rtl" lang="ar" class="mt-1 min-h-[1.75rem] text-2xl leading-9 text-foreground"></p>

        <button id="tap" type="button" aria-label="Say" style="touch-action:manipulation" class="relative mx-auto mt-3 flex h-60 w-60 select-none items-center justify-center rounded-full bg-chart2/10 active:scale-[0.98] transition-transform">
          <svg viewBox="0 0 200 200" class="absolute inset-0 h-full w-full -rotate-90" aria-hidden="true">
            <circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="10" class="text-border"></circle>
            <circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="565.5" class="text-chart2 transition-[stroke-dashoffset] duration-200"></circle>
          </svg>
          <span class="relative flex flex-col items-center">
            <span id="count" class="font-heading text-6xl font-bold tabular-nums">0</span>
            <span id="of" class="mt-1 text-sm font-semibold text-muted-foreground"></span>
          </span>
        </button>
        <p id="tap-hint" class="mt-2 text-[11px] text-muted-foreground" data-i18n="tesTapHint">Saymak için dokun</p>
        <p id="round-msg" class="mt-1 min-h-[1.25rem] text-sm font-bold text-success" aria-live="polite"></p>

        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="btn-undo" type="button" class="h-11 rounded-theme border border-border bg-input text-xs font-bold text-card-foreground" data-i18n="tesUndo">Geri al (−1)</button>
          <button id="btn-reset" type="button" class="h-11 rounded-theme border border-border bg-input text-xs font-bold text-card-foreground" data-i18n="tesReset">Sıfırla</button>
        </div>
        <div class="mt-3 flex items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-[11px] font-semibold text-muted-foreground"><span data-i18n="tesTarget">Hedef</span>
            <select id="target" class="h-10 rounded-lg border border-border bg-input px-2 text-sm text-foreground outline-none"></select></label>
          <label class="flex items-center gap-2 text-[11px] font-semibold text-muted-foreground"><span data-i18n="tesVibrate">Titreşim</span>
            <input id="vib" type="checkbox" class="h-5 w-5 accent-[#a78bfa]"></label>
        </div>
      </section>

      <section class="mt-4 grid grid-cols-2 gap-3">
        <div class="rounded-[20px] border border-border bg-card p-3.5"><p class="text-[11px] font-semibold text-muted-foreground" data-i18n="tesRounds">Tamamlanan tur</p><p id="rounds" class="mt-1 font-heading text-2xl font-bold">0</p></div>
        <div class="rounded-[20px] border border-border bg-card p-3.5"><p class="text-[11px] font-semibold text-muted-foreground" data-i18n="tesToday">Bugün toplam</p><p id="today" class="mt-1 font-heading text-2xl font-bold text-chart2">0</p></div>
      </section>

      <section class="mt-4 rounded-[22px] border border-border bg-card/70 p-4">
        <p class="text-[11px] font-semibold text-muted-foreground" data-i18n="tesWeek">Son 7 gün</p>
        <div id="week" class="mt-2 flex h-20 items-end gap-1.5"></div>
        <div id="week-days" class="mt-1 flex gap-1.5 text-center text-[10px] text-muted-foreground"></div>
      </section>

      <p class="mt-4 text-[11px] leading-5 text-muted-foreground" data-i18n="tesNote">Bu sayfa yalnızca bir sayaçtır; sayıların yalnızca bu telefonda saklanır.</p>

    </main>
  </div>

  <script src="wb-strings.js"></script>
  <script src="i18n.js"></script>
  <script src="wellbeing.js"></script>
  <script src="tesbih.js"></script>
</body>
</html>
