  <title>Hoş geldin — Hemcan</title>

  <!-- Uygulama her açılışta ~2 saniyeliğine bu ekranı (marka + slogan)
       gösterip sonra anasayfaya (asistan.html) geçiyor — bkz. aşağıdaki
       kapanış script'i. Zaten onboarding'i tamamlamış (dönen) bir
       kullanıcıysa, fiyat rozetini/CTA butonunu/notu göstermeye gerek yok
       (o kısım sadece ilk kayıt akışı için) — bunun için <html>'e erkenden
       (kart boyanmadan önce, yanıp sönmeyi önlemek için) bir sınıf
       ekliyoruz; CSS bu sınıfa göre "sadece onboarding'e özel" öğeleri
       gizliyor.  -->
  <script>
    try {
      if (localStorage.getItem('one-onboarded') === '1') {
        document.documentElement.classList.add('returning-user');
      }
    } catch (e) {}
  </script>

  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>

  <style>

    --color-foreground: #EFF7FF;
    --color-primary: #39D7FF;
    --color-primary-foreground: #03121C;
    --color-secondary: #162A46;

    --color-accent: #A78BFA;
    --color-accent-foreground: #130D28;
    --color-muted: #10213A;
    --color-muted-foreground: #A8BCD3;
    --color-card: #0C1B30;
    --color-card-foreground: #EFF7FF;
    --color-border: #28415F;
    --color-input: #102540;
    --color-destructive: #FF657A;
    --color-destructive-foreground: #26040A;
    --color-success: #3DDBA5;
    --color-success-foreground: #031B14;
    --color-chart1: #39D7FF;
    --color-chart2: #A78BFA;
    --color-chart3: #3DDBA5;

  }
  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding: 0;
  }
  /* Dönen (zaten onboarding'i tamamlamış) kullanıcılar için kısa marka
     ekranı: sadece ilk kayıt akışına özel öğeleri (dil seçici, deneme
     rozeti, fiyat notu, CTA butonu, iptal notu) gizle — ikon + slogan
     görünmeye devam etsin. */
  .returning-user .onboarding-only { display: none !important; }
  .hemcan-logo {
    background: linear-gradient(160deg, #17305A 0%, #0F2447 100%);
    box-shadow: 0 0 0 6px rgba(57,215,255,0.07), 0 0 44px rgba(57,215,255,0.38), inset 0 1px 0 rgba(255,255,255,0.10);
    animation: hemcanLogoGlow 3.2s ease-in-out infinite;
  }
  @keyframes hemcanLogoGlow {
    0%, 100% { box-shadow: 0 0 0 6px rgba(57,215,255,0.07), 0 0 38px rgba(57,215,255,0.30), inset 0 1px 0 rgba(255,255,255,0.10); }
    50% { box-shadow: 0 0 0 10px rgba(57,215,255,0.10), 0 0 56px rgba(57,215,255,0.50), inset 0 1px 0 rgba(255,255,255,0.10); }
  }
  @media (prefers-reduced-motion: reduce) { .hemcan-logo { animation: none; } }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111F">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body class="bg-background text-foreground m-0 p-0">
  <div class="min-h-screen w-full bg-background text-foreground font-body relative overflow-hidden">
    <div class="pointer-events-none absolute -top-32 -right-28 h-80 w-80 rounded-full bg-primary/10 blur-3xl"></div>
    <div class="pointer-events-none absolute top-[430px] -left-36 h-72 w-72 rounded-full bg-accent/10 blur-3xl"></div>

    <header class="onboarding-only relative flex items-center justify-end px-5 pt-6">
      <select id="lang-select" aria-label="Dili değiştir / Change language" class="h-11 max-w-[92px] rounded-theme border border-border bg-card px-2 text-xs font-bold text-card-foreground"></select>
    </header>

    <main class="relative flex min-h-[calc(100vh-72px)] flex-col items-center justify-center px-6 pb-10 text-center">
      <!-- Hemcan logosu: keskin kalması için satır içi SVG (ağdan/CDN'den
           yüklenmez, her ekran yoğunluğunda net çizilir). -->
      <div class="hemcan-logo mx-auto flex h-28 w-28 items-center justify-center rounded-[32px] border-2 border-primary/50">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="url(#hemcan-logo-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Hemcan">
          <defs>
            <linearGradient id="hemcan-logo-grad" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#7BE8FF"/>
              <stop offset="1" stop-color="#39D7FF"/>
            </linearGradient>
          </defs>
          <path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676a.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052a2.12 2.12 0 0 0-.004-3a2.124 2.124 0 1 0 3-3a2.124 2.124 0 0 0 3.004 0a2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0a2 2 0 0 1 0-2.828l2.823-2.762"/>
        </svg>
      </div>
      <p class="mt-4 font-heading text-lg font-bold uppercase tracking-[0.32em] text-foreground">Hemcan</p>

      <h1 class="mt-6 max-w-sm font-heading text-2xl font-semibold leading-tight tracking-tight" data-i18n="onboardHeadline">Şu anki ve gelecekteki seni düşünen, iyi hissettirecek tek uygulama</h1>

      <p class="mt-6 max-w-sm font-heading text-xl font-bold leading-snug tracking-wide text-primary" data-i18n="onboardSlogan">BİRLİKTE GÜÇLÜYÜZ 💪💪💪</p>

      <div class="onboarding-only mt-5 flex items-center gap-2 rounded-full border border-success/25 bg-success/10 px-4 py-2">
        <iconify-icon icon="lucide:gift" class="text-base text-success"></iconify-icon>
        <span class="text-xs font-bold text-success" data-i18n="planTrialBadge">İlk 1 hafta ücretsiz</span>
      </div>

      <p class="onboarding-only mt-4 max-w-xs text-sm leading-6 text-muted-foreground" data-i18n="onboardTrial">İlk 1 hafta ücretsiz, sonrasında ayda sadece 10 TL.</p>

      <button id="btn-start" class="onboarding-only mt-8 flex h-14 w-full max-w-xs items-center justify-center gap-2 rounded-theme bg-primary text-sm font-bold text-primary-foreground shadow-[0_0_24px_rgba(57,215,255,0.3)]">
        <span data-i18n="onboardCta">Ücretsiz Başla</span>
        <iconify-icon icon="lucide:arrow-right" class="text-lg"></iconify-icon>
      </button>
      <p class="onboarding-only mt-3 text-[11px] text-muted-foreground" data-i18n="onboardNote">İstediğin zaman iptal edebilirsin.</p>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      // Dönen (zaten onboarding'i tamamlamış) kullanıcı: bu ekranı marka/slogan
      // ekranı ("splash") olarak ~6 saniye göster, sonra otomatik olarak
      // anasayfaya geç. Ekrana dokunan beklemeden geçebilir. Onboarding akışının
      // geri kalanı (üyelik, deneme süresi vb.) bu durumda hiç çalıştırılmaz.
      var SPLASH_MS = 6000;
      var isReturningUser = false;
      try { isReturningUser = localStorage.getItem('one-onboarded') === '1'; } catch (e) {}
      if (isReturningUser) {
        var splashTimer = setTimeout(goHome, SPLASH_MS);
        function goHome() { clearTimeout(splashTimer); location.replace('asistan.html'); }
        document.addEventListener('click', goHome, { once: true });
        return;
      }

      var SUB_ID_KEY = 'one-sub-id';
      function getSubId() {
        var id = localStorage.getItem(SUB_ID_KEY);
        if (!id) {
          id = (crypto.randomUUID ? crypto.randomUUID() : 'one-' + Date.now() + '-' + Math.random().toString(36).slice(2));
          localStorage.setItem(SUB_ID_KEY, id);
        }
        return id;
      }

      function goToApp() {
        try {
          localStorage.setItem('one-onboarded', '1');
          localStorage.setItem('one-trial-start', new Date().toISOString().slice(0, 10));
        } catch (e) {}
        location.href = 'asistan.html';
      }

      document.getElementById('btn-start').addEventListener('click', function () {
        var id = getSubId();
        // Sunucuya yeni üye kaydını bildir (ana ekrandaki gerçek üye
        // sayacı için). `keepalive: true` önemli: bunsuz, hemen ardından
        // yaptığımız sayfa yönlendirmesi tarayıcının bu isteği yarıda kesip
        // iptal etmesine (net::ERR_ABORTED) yol açabilir — test sırasında
        // tam da bunu tespit ettim. keepalive, istek arka planda devam
        // ederken sayfadan hemen çıkabilmemizi sağlıyor; kullanıcıyı ağ
        // isteğinin bitmesini bekletmemize gerek kalmıyor.
        try {
          fetch('/api/member-count', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id }),
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
        goToApp();
      });
    })();
  </script>
  <script>
    // Icon self-healing (see asistan.html for full explanation).
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
  <script src="currencies.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
