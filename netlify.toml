[build]
  publish = "."
  functions = "netlify/functions"

# Android uygulamasının Firebase ayar dosyası (google-services.json) içindeki "AIza..." anahtarı,
# her Android uygulamasında bulunan ve gizli olmayan (herkese açık) bir istemci anahtarıdır.
# Netlify'ın gizli anahtar taraması bunu yanlışlıkla "sır" sanıp derlemeyi durduruyor;
# yalnızca bu dosya taramadan çıkarılır (diğer dosyalar taranmaya devam eder).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "native/android/app/google-services.json"

# Kaldırılan sekmeler: eski bağlantılar ana sayfaya gitsin.
[[redirects]]
  from = "/bellek.html"
  to = "/asistan.html"
  status = 302

[[redirects]]
  from = "/cihazlar.html"
  to = "/asistan.html"
  status = 302

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Android (TWA) uygulamasının bu siteyle bağını doğrulamak için gereken
# Digital Asset Links dosyası. Not: Netlify'ın manuel (sürükle-bırak/zip)
# deploy yöntemi, "." ile başlayan klasörleri (ör. .well-known) deploy'dan
# otomatik olarak siliyor — bu yüzden gerçek içeriği normal bir dosyada
# (assetlinks-content.json) tutup buradan "/.well-known/assetlinks.json"
# isteğini ona yönlendiriyoruz (status 200 = adres çubuğu değişmeden,
# şeffaf olarak o dosyanın içeriğini döndürür).
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/assetlinks-content.json"
  status = 200

# Bildirim gönderici — her 5 dakikada bir çalışır (bkz. send-notifications.js).
[functions."send-notifications"]
  schedule = "*/5 * * * *"
